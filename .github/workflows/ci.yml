name: CI

# Gates de la phase 1 sur chaque PR. Aucun déploiement ici — voir deploy.yml.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# Une PR qui reçoit trois commits ne fait tourner que le dernier.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Deny-by-default : le workflow ne lit que le code, il n'écrit rien.
permissions:
  contents: read

jobs:
  gates:
    name: lint · test · build · audit
    runs-on: ubuntu-latest
    # 🔴 LE FILET DE TEMPS DU JOB — né d'un incident, pas d'une précaution théorique.
    # Le 2026-08-19, l'étape d'installation du navigateur a PENDU : 53 min sur le premier essai,
    # puis 12+ min sur le second, là où le run entier tenait en 2 min 12 s la veille. Aucun
    # workflow du dépôt ne portait de `timeout-minutes` : un job pendu court donc jusqu'au plafond
    # GitHub de SIX HEURES, et la PR reste « en cours » sans jamais rougir. Le mode d'échec n'est
    # pas le temps perdu par la machine (le dépôt est public, les minutes sont gratuites) — c'est
    # le SILENCE : rien ne distingue « la CI travaille » de « la CI est morte », et l'humain qui
    # attend son gate vert n'a aucun signal pour trancher. 25 min laisse ~10× la marge du run
    # nominal ; au-delà, c'est une panne, et une panne doit se NOMMER.
    timeout-minutes: 25
    steps:
      # Majeures épinglées sur des actions qui tournent en Node 24 (checkout ≥ v5, setup-node ≥ v5).
      # En v4 elles ciblaient Node 20, déprécié : les runners les forçaient déjà en 24 avec un
      # avertissement, et ce forçage finira par disparaître.
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24' # Angular 22 exige ≥ 24.15
          cache: npm

      # `--ignore-scripts` : voir le raisonnement mesuré dans `deploy.yml`, job `contenu`, à la même
      # étape. Résumé — aucun script de cycle de vie propre au projet, binaires natifs livrés par les
      # optionalDependencies de plateforme, seul `keytar` (dev, chemin de connexion de `swa`) en
      # dépend. Tenu par un tripwire dans `src/workflows-github.spec.ts`.
      - name: Installer (verrouillé)
        run: npm ci --ignore-scripts

      # ⚠️ REMONTÉE ICI EXPRÈS — ne pas la redescendre près de G-e2e.
      # Ce n'est plus seulement le navigateur du gate de bout en bout : `rendre-mermaid.mjs`
      # invoque `mmdc` en lui imposant CE Chromium-là (`.puppeteerrc.cjs` interdit à Puppeteer de
      # télécharger le sien — ~200 Mo pour un binaire en double). Or l'étape suivante compile
      # `content/`, donc rend les diagrammes. Tant que `content/` est vide, personne ne le voit ;
      # le jour où E3-ST1 publie sa première leçon avec un diagramme, une installation restée en
      # aval ferait échouer la compilation, dans les DEUX workflows, sur un message parlant de
      # Playwright au milieu d'une étape de contenu. Coût net nul : c'est la même installation,
      # plus tôt. G-e2e n'appelle donc plus que `npm run e2e`.
      # ⚠️ SCINDÉE EN DEUX LE 2026-08-19, PUIS AMPUTÉE DE SA MOITIÉ APT LE MÊME JOUR — et c'est la
      # scission qui a permis de savoir laquelle amputer.
      #
      # `playwright install --with-deps chromium` faisait DEUX choses sous un seul nom : un
      # `apt-get install` en root (réseau vers les miroirs Ubuntu) puis un téléchargement de binaire
      # depuis le CDN de Playwright. Quand l'étape a pendu — 53 min, puis 12 min, contre 2 min 12 s
      # pour le run entier la veille — le journal n'avait rien écrit : impossible de dire laquelle
      # des deux bloquait. Scindée, elle a nommé son coupable au run suivant.
      #
      # 📐 CE QUE LA MESURE A MONTRÉ (déploiement 32264319046, 2026-08-19) :
      #   14:29:58  Get:2 fonts-ipafont-gothic (3 513 ko)
      #   14:32:09  Get:3 fonts-freefont-ttf   (5 641 ko)   ← 2 min 11 s pour 3,5 Mo, ~27 ko/s
      #   14:35:03  délai de 5 min dépassé
      # `azure.archive.ubuntu.com` servait au ralenti. Et surtout, le journal listait ce qui restait
      # à installer : les bibliothèques partagées de Chromium (`libxrandr2`, `libfontconfig1`,
      # `libfreetype6`, `xvfb`…) étaient TOUTES déjà présentes sur l'image du runner — « already the
      # newest version ». Les 21 Mo manquants étaient NEUF paquets, et les neuf sont des POLICES :
      # `fonts-freefont-ttf`, `fonts-ipafont-gothic` (japonais), `fonts-tlwg-loma-otf` (thaï),
      # `fonts-unifont`, `fonts-wqy-zenhei` (chinois), `xfonts-cyrillic`, `xfonts-encodings`,
      # `xfonts-scalable`, `xfonts-utils`.
      #
      # DONC ON NE L'INSTALLE PLUS. Ce site est en français, ses diagrammes Mermaid aussi : aucun
      # de ces jeux de glyphes n'est rendu par quoi que ce soit ici. On payait un téléchargement
      # fragile de 21 Mo, EN ROOT, sur le workflow qui détient le jeton de déploiement, pour des
      # polices que personne ne peint. Bénéfice de sécurité au passage : l'`apt-get` en root
      # disparaît de la CI, ce qui retire l'un des deux risques hors du sceau d'artéfact décrits
      # dans `deploy.yml`.
      #
      # ⚠️ CE QU'ON ACCEPTE EN ÉCHANGE, dit franchement : si une leçon future portait un diagramme
      # avec des glyphes non latins (CJK, cyrillique, thaï), ils sortiraient en tofu (▯) dans le SVG
      # rendu au build. Le jour où ça arrive, la parade est de réinstaller CES polices-là,
      # nommément — pas de rétablir `--with-deps` en bloc. Et si l'image du runner cessait un jour
      # de porter les bibliothèques de Chromium, Playwright échoue en le DISANT et en nommant
      # `install-deps` : le mode d'échec reste lisible, il ne devient pas silencieux.
      #
      # `e2e:install:deps` reste défini dans `package.json` pour le développeur Linux sur machine
      # nue, et `e2e:install` l'enchaîne toujours — c'est la CI, et elle seule, qui s'en passe.
      - name: Installer le navigateur (Chromium — partagé Mermaid/Playwright)
        timeout-minutes: 5
        run: npm run e2e:install:navigateur

      # LE PIPELINE DE CONTENU, ET IL VIENT AVANT G-LINT — pas par élégance.
      # `src/styles.scss` fait `@use` sur `styles/coloration-syntaxique-generee`, une feuille
      # GITIGNORÉE que seul ce pipeline produit. Sur un checkout frais elle n'existe pas : sans
      # cette étape, c'est G-test qui tombe en premier (le spec du design system compile la feuille
      # globale), avant même G-build, sur une erreur Sass qui ne nomme pas la cause. L'étape est
      # aussi le gate du contenu lui-même : un `lecon.md` ou un `quiz.json` malformé fait échouer
      # la construction ICI, en nommant le fichier et le champ fautifs.
      #
      # ⚠️ CETTE ÉTAPE-CI GARDE LA RACINE DE PRODUCTION (`content/`), et elle doit la garder. C'est
      # ELLE le gate du contenu réellement publié. Le détour par la fixture témoin (décision E-2),
      # qui faisait bâtir à G-build un artéfact interactif pendant que `content/` était vide, est
      # RETIRÉ depuis la clôture d'E3-ST1 : les deux workflows bâtissent le même artéfact, celui
      # qui part en ligne. Faire basculer cette étape sur une fixture laisserait un `lecon.md`
      # malformé de `content/` passer la CI et ne tomber qu'au déploiement.
      - name: Compiler `content/` (pipeline)
        run: npm run content:build

      - name: G-lint
        run: npm run lint

      # L'outillage Node n'appartenait à AUCUN tsconfig : `generer-config-swa.mjs`, qui écrit la CSP
      # du site et épingle le hachage de son unique script inline, était le seul code du dépôt sans
      # vérification de types. ESLint ne comble pas ce trou — il ne connaît pas les types. Un gate
      # séparé parce que ces scripts ne sont ni compilés par `ng build` ni exécutés par `ng test` :
      # rien d'autre ne les regarderait.
      - name: G-typage-outils
        run: npm run typecheck:tools

      # Gate du design system : ratios de contraste WCAG de chaque paire de jetons dans les DEUX
      # thèmes, plus la cohérence des échelles typo (ratio ≥ 1.25) et d'espacement (multiples de 4).
      # Mode `--check` : le script n'écrit rien, il compare le rapport régénéré à celui du dépôt et
      # sort en 1 s'il diverge — sans ça, un rapport commité périmé ne ferait échouer personne.
      - name: G-contraste
        run: npm run design:contrastes:check

      # Gate des polices auto-hébergées : ouvre chaque .woff2 livré, décompresse son flux et lit sa
      # table cmap. Vérifie les DEUX moitiés — le caractère est dans un unicode-range déclaré ET le
      # fichier porte vraiment son glyphe. Un sous-ensemble trop agressif casse « œ », « » et ’ en
      # silence, au milieu d’un mot : sans ce gate, rien ne le signalerait avant la mise en ligne.
      - name: G-glyphes
        run: npm run design:glyphes

      - name: G-test
        run: npm test

      # ✅ LE HARNAIS DE FIXTURE A ÉTÉ RETIRÉ LE 2026-08-20, à la clôture d'E3-ST1, exactement
      # comme sa péremption l'annonçait. `content/` porte sa première leçon publiée
      # (`01-fondamentaux`) : bâtir depuis la fixture témoin masquerait désormais le contenu RÉEL
      # — G-axe, G-e2e et le générateur de CSP auditeraient un double de test au lieu de ce qui
      # part en ligne, ce qui est le mode d'échec L-007 exactement. Les deux workflows bâtissent
      # donc le MÊME artéfact, et l'écart nommé par la décision E-2 (E2-ST3) est CLOS.
      #
      # `npm run build`, et non ses trois commandes dépliées : c'est le script que `deploy.yml`
      # exécute pour publier, donc le seul dont le vert ICI prouve quelque chose LÀ-BAS. Il
      # enchaîne `content:build`, `ng build` et `config:swa` — ce dernier sort en code 1 si la
      # sortie prerendue casse la CSP (gestionnaire inline, script inline, attribut style) : ce
      # gate protège donc aussi la CSP, pas seulement la compilation.
      #
      # ⚠️ AUCUN `--racine`, AUCUN `--hachages-style`, et les deux absences sont gardées. Le
      # générateur retombe sur `NOMBRE_HACHAGES_STYLE_ATTENDU`, épinglé et revu à la main dans
      # `src/config-swa-provenance-style.spec.ts` ; un drapeau qui réapparaîtrait ici desserrerait
      # un contrôle d'égalité exacte sans passer par cette revue, au moment de pression maximale
      # (build rouge, cf. S-011). `src/workflows-github.spec.ts` rougit si l'un des deux revient.
      #
      # ⚠️ Le binaire `ng` vient de `node_modules/.bin` — npm l'y met sur le PATH — et jamais de
      # `npx`, qui INSTALLE À LA DEMANDE ce qu'il ne trouve pas : une version non épinglée dont
      # les scripts de cycle de vie s'exécuteraient dans le job qui bâtit l'artéfact publié. Voie
      # d'entrée classique d'une compromission de chaîne d'approvisionnement, que ce dépôt
      # ENSEIGNE (SonarCloud `githubactions:S6505` et `S8543` sur la PR #17, tous deux justes).
      - name: G-build (+ config SWA à hachages)
        run: npm run build

      # Gate d'accessibilité : axe-core exécuté dans jsdom sur CHAQUE page prerendue de
      # `dist/dr-je-sais-tout/browser`. Il vient donc APRÈS G-build, qui produit l'artéfact.
      # ✅ CET ARTÉFACT CONTIENT UNE PAGE DE LEÇON INTERACTIVE, ET C’EST DÉSORMAIS LA VRAIE :
      # `cours/securite-web/fondamentaux/index.html`, avec son quiz de 8 questions — la leçon 01
      # publiée le 2026-08-20. Le lot E (décision E-2) avait dû la SIMULER depuis la fixture témoin
      # parce que `content/` était vide ; ce détour est clos avec le harnais. Jusqu’au lot E, axe
      # n'avait JAMAIS vu le `QuizComponent` : il auditait trois pages inertes. Ne pas déplacer cette étape
      # avant G-build, ni y reconstruire l'artéfact — elle doit voir CELUI de G-build.
      # Pas de Playwright : le site est 100 % prerendu, et `jsdom` était déjà là — `axe-core` est la
      # seule dépendance ajoutée (devDep, 0 octet en production).
      #
      # DEUX commandes, dans cet ordre. L'auto-test prouve d'abord que le gate MORD : une fixture par
      # famille de règle (code 1 attendu et règle nommée), une page conforme (code 0), un dossier
      # absent puis un dossier sans page (code 1 — L-014, un gate ne peut pas être vert en n'ayant
      # rien vérifié). Ensuite seulement, l'audit des vraies pages. Sans l'auto-test, une montée
      # d'axe ou de jsdom pourrait rendre ce gate muet sans que rien ne l'annonce.
      #
      # CE QU'IL COUVRE : repères (landmarks) ARIA, hiérarchie des titres, mécanisme d'évitement,
      # noms accessibles (boutons, liens, images), langue du document, étiquettes de formulaire,
      # attributs ARIA — ~85 règles, dont 34 nommément promises et confrontées à `axe.getRules()`.
      # CE QU'IL NE COUVRE PAS : l'interaction et l'ordre de tabulation au CLAVIER, le focus visible
      # ou masqué, la taille de cible et le contraste — jsdom ne calcule ni boîtes ni cascade. Le
      # contraste est mesuré en amont par G-contraste ; tout le reste est désormais couvert par
      # G-e2e ci-dessous (c'était la dette (a) d'E1-ST2, elle est remboursée). Le script IMPRIME
      # cette liste et ses règles désactivées à chaque exécution : le journal fait foi (L-005).
      - name: G-axe
        run: |
          npm run a11y:axe:auto-test
          npm run a11y:axe

      # Gate d'accessibilité COMPORTEMENTALE — la moitié qu'axe ne peut structurellement pas voir.
      # Playwright pilote un vrai Chromium qui presse de vraies touches : ordre de tabulation réel,
      # absence de piège du focus, indicateur de focus effectivement calculé et non recouvert
      # (WCAG 2.4.7 et 2.4.11), taille de cible mesurée à la mise en page (2.5.8, niveau AA —
      # 24 × 24 px CSS ; le 44 × 44 relève de 2.5.5, niveau AAA, hors de la barre du projet, et
      # n'est qu'imprimé au journal). Vient APRÈS G-build, dont il sert l'artéfact.
      #
      # ⚠️ LE SERVEUR EST `swa start`, ET C'EST LE POINT. Il émule le runtime d'Azure Static Web
      # Apps, donc il APPLIQUE le `staticwebapp.config.json` généré dans l'artéfact : la page est
      # exercée sous la CSP stricte à hachages réellement servie en production. Un serveur statique
      # nu livrerait les mêmes octets en ignorant la CSP — et tout ce qu'elle bloque en ligne
      # passerait vert ici. C'est exactement le point aveugle de la leçon S-005 : la CSP avait été
      # validée sur une page INERTE, et le premier écouteur d'événement a fait injecter par Angular
      # des scripts inline que personne n'avait vus.
      #
      # Le navigateur est installé BIEN PLUS HAUT (voir l'étape « Installer le navigateur ») :
      # `rendre-mermaid.mjs` réutilise ce même Chromium pour rendre les diagrammes, et la
      # compilation du contenu passe avant tous les gates. `npm run e2e` enchaîne le typage des
      # specs (`tsconfig.e2e.json`, 4ᵉ programme du dépôt) puis la suite elle-même. `CI=true` est
      # posé par GitHub Actions : `forbidOnly` mord, et aucun serveur préexistant n'est réutilisé.
      - name: G-e2e (accessibilité au clavier, sous CSP réelle)
        run: npm run e2e

      # Surface de PRODUCTION uniquement, et tolérance zéro : `--omit=dev` doit rester à 0.
      # Le audit complet remonte 3 « moderate » dev-only via le SDK MCP d'@angular/cli, dont le
      # correctif downgraderait la CLI en v21 — refusé (voir CLAUDE.md §Commandes).
      - name: G-audit
        run: npm audit --omit=dev

      # TROIS gates d'accessibilité, et aucun ne remplace les autres — c'est voulu. G-contraste est
      # la moitié AMONT (il mesure les jetons, pas les pages rendues) ; G-axe est la passe
      # STRUCTURELLE sur le HTML prerendu ; G-e2e est la passe COMPORTEMENTALE dans un vrai
      # navigateur. Retirer l'un d'eux rouvre un angle mort que les deux autres ne voient pas.
      #
      # ⚠️ Cette liste de gates doit rester ALIGNÉE avec celle de deploy.yml, qui les rejoue avant
      # publication. Un gate ajouté ici et pas là-bas ne protège pas ce qui part en ligne.
      # ⚠️ L'alignement porte sur la LISTE DES GATES, PAS SUR LA TOPOLOGIE DES JOBS. `deploy.yml`
      # est scindé en trois jobs (`contenu` → `gates` → `publication`) à dessein : il détient un
      # jeton, pose un sceau d'artéfact et publie. Ce workflow-ci ne fait aucun des trois, donc les
      # deux coupes n'y protégeraient rien et coûteraient deux transferts d'artéfact par run. Ce
      # fichier reste MONO-JOB volontairement — ce n'est pas un oubli à « réparer ».
      #
      # Les gates Terraform vivent dans infra.yml, déclenché par un filtre `paths` natif.
