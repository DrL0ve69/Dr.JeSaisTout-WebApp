name: Déploiement (main → SWA Free)

# Les mêmes gates que la CI, puis publication. Rien ne part en ligne sans être passé au vert.
#
# ⚠️ Ce workflow ne provisionne RIEN : la ressource Azure est créée par Terraform depuis le poste
# du propriétaire (voir infra/README.md). La CI ne détient donc aucun identifiant Azure à haut
# privilège — seulement le jeton de déploiement de la Static Web App, dont la portée se limite à
# téléverser du contenu statique dans cette ressource.
#
# ⚠️ TROIS JOBS, ET LES DEUX COUPES SONT DES MESURES DE SÉCURITÉ — PAS DES COMMODITÉS.
# `contenu` compile `content/` (donc rend les diagrammes, donc exécute un navigateur) ; `gates`
# exécute toute la vérification et ne reçoit AUCUN secret ; `publication` détient le jeton et ne
# fait que téléverser l'artéfact produit, puis constater le résultat en ligne.
#
# COUPE N°1 — `publication` À PART, POUR PROTÉGER LE JETON. Ce qui l'a imposée : la compilation et
# les gates exécutent un navigateur Playwright, c'est-à-dire un binaire téléchargé depuis un CDN,
# HORS du contrôle d'intégrité de `package-lock.json`. Tant que cette étape partageait le job du
# déploiement, du code téléchargé s'exécutait sur la machine qui détient le jeton de publication.
# Constat de la revue de sécurité d'E1-ST2 ; arbitrage du propriétaire.
#
# COUPE N°2 — `contenu` À PART, POUR RENDRE AU SCEAU SA PORTÉE PLEINE (lot C de la dette sécurité
# pré-E3-ST1). `rendre-mermaid.mjs` impose à `mmdc` le Chromium de Playwright ; la compilation du
# contenu exige donc ce binaire, et elle doit précéder lint/test/build. Tant que les deux vivaient
# dans le même job, le binaire CDN s'exécutait sur la machine qui bâtit `dist/`, EN AMONT du sceau :
# celui-ci ne couvrait plus que la fenêtre construction → téléversement. `contenu` porte désormais
# seul le navigateur et la compilation ; il remet ses sorties en artéfact, et `gates` bâtit `dist/`
# sur une machine où AUCUN binaire CDN n'a encore tourné. Le tripwire de cette promesse est
# structurel, pas déclaratif : si le cache Mermaid transféré était incomplet, `content:build`
# rappellerait `mmdc` dans `gates` et échouerait faute de Chromium — bruyamment, en le nommant.
# ⚠️ ET IL NE DISCRIMINE QUE DEPUIS LE 2026-08-19. Tant que `creerRendeurMermaid()` localisait
# Chromium À LA CONSTRUCTION, il se déclenchait sur cache COMPLET comme sur cache troué : il ne
# prouvait donc rien sur le cache, il prouvait seulement l'absence du navigateur. La localisation
# est devenue PARESSEUSE (`rendre-mermaid.mjs`, `localiserOutils`), et le comportement a été
# MESURÉ sur la fixture `mermaid-deux-diagrammes`, `PLAYWRIGHT_BROWSERS_PATH` pointant un dossier
# vide : cache 2/2 ⇒ code 0 ; une seule entrée retirée ⇒ code 1, « Chromium de Playwright
# introuvable ». C'est ce delta, et lui seul, qui fait du tripwire une mesure.
#
# ⚠️ CE QUE CES COUPES NE FONT PAS, ET QUI EST COUVERT AUTREMENT — ou pas du tout.
#   · Isoler le secret protège le JETON, pas l'ARTÉFACT : dans `gates`, G-axe et G-e2e s'exécutent
#     entre la construction de `dist/` et son envoi, et pourraient donc le réécrire. C'est le
#     **sceau d'empreintes** (étapes « Sceller l'artéfact » / « Vérifier le sceau avant
#     publication ») qui ferme cette fenêtre — pas la coupe.
#   · 🔴 ET CE QUI RESTE ENTIER, dit ici pour que personne ne lise ce bloc comme « la dette est
#     réglée » (patron S-009) : `gates` CONSOMME LES SORTIES DE `contenu` — pas seulement les SVG,
#     mais TOUT le tarball : les leçons compilées de `src/content-generated/`, le manifeste de
#     routes, la carte d'imports, la feuille SCSS de coloration. Tout cela finit dans `dist/`. Un
#     Chromium compromis dans `contenu` a tourné sur la machine qui a produit ces fichiers-là ; ce
#     que la coupe n°2 retire, c'est l'exécution du binaire CDN sur la machine de CONSTRUCTION, pas
#     la confiance dans ce qu'il a laissé derrière lui.
#     ⚠️ Ne pas lire l'analyseur à liste blanche de `rendre-mermaid.mjs` comme la parade de ce
#     reliquat — mais ne pas non plus le lire comme un pur no-op côté `gates` : un commentaire qui
#     SOUS-estime une garantie est un défaut S-009 au même titre qu'un qui la sur-estime, parce
#     qu'il invite le prochain lecteur à rajouter une protection qui existe déjà, ou à croire ce
#     lot plus faible qu'il n'est. Ce que `gates` REVÉRIFIE, mesuré : quand `content:build` y
#     repasse, chaque socle du cache Mermaid restauré retraverse l'analyseur — 7 SVG du cache
#     empoisonnés en labo, tous REFUSÉS, code 1, sans aucun navigateur. Ce qu'il NE revérifie
#     PAS : les leçons compilées, où les SVG sont déjà inlinés — elles arrivent telles quelles et
#     rien ne les réanalyse. L'analyseur durcit donc la sortie de `mmdc` à l'endroit où elle est
#     produite ET couvre le cache au rebond ; il ne referme pas pour autant la confiance
#     transférée d'un job à l'autre. Ce qui garde CETTE frontière, c'est la liste blanche de
#     membres de l'étape de déballage — et elle contrôle des SEGMENTS de chemin, des NOMS et des
#     TYPES, jamais du contenu.
#
# La règle qui en découle, pour tout gate ajouté plus tard : un gate va dans `gates`, jamais dans
# `publication` ni dans `contenu`. Si une étape a besoin du jeton, elle ne vérifie rien ; si elle
# vérifie quelque chose, elle n'a pas besoin du jeton. Et si elle a besoin d'un navigateur AVANT
# G-build, elle va dans `contenu` — sinon elle rouvre la fenêtre que la coupe n°2 vient de fermer.
#
# ⚠️ `ci.yml` RESTE MONO-JOB, ET CE N'EST PAS UN OUBLI À RATTRAPER. Les deux coupes ci-dessus n'ont
# de sens que là où il y a quelque chose à protéger : un JETON (`ci.yml` n'en détient aucun), un
# SCEAU d'artéfact (`ci.yml` n'en pose pas), une PUBLICATION (`ci.yml` ne téléverse rien). Y
# transposer trois jobs coûterait deux transferts d'artéfact par run pour ne fermer aucune fenêtre.
# La doctrine d'alignement des deux workflows (note de `ci.yml`, § « G-audit ») porte sur la LISTE
# DES GATES — un gate absent d'un des deux ne protège pas ce qui part en ligne (L-007) — jamais sur
# la topologie des jobs. Aligner les topologies serait « réparer » une divergence VOULUE.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Jamais deux déploiements concurrents ; et on ne coupe pas un déploiement en cours.
concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # JOB 1 — la compilation du contenu, et RIEN d'autre. LE SEUL JOB QUI EXÉCUTE UN
  # NAVIGATEUR AVANT LA CONSTRUCTION DE `dist/`.
  # Il ne vérifie rien, ne bâtit pas `dist/`, ne reçoit aucun secret. Il rend les diagrammes
  # Mermaid (donc démarre `mmdc`, donc le Chromium de Playwright) et remet ses sorties en
  # artéfact. Tout ce qui a touché au binaire CDN reste enfermé ici.
  # ---------------------------------------------------------------------------
  contenu:
    name: contenu (compilation — navigateur isolé ici)
    runs-on: ubuntu-latest
    # Même filet que partout ailleurs, et pour la même panne du 2026-08-19 : ce job porte
    # désormais l'étape d'installation du navigateur qui a pendu. Raisonnement dans `ci.yml`.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      # ⚠️ `--ignore-scripts` EST POSÉ SUR LES TROIS `npm ci` DES DEUX WORKFLOWS, PAS SEULEMENT ICI.
      # Constat SonarCloud `githubactions:S6505` : sans lui, un script de cycle de vie d'une
      # dépendance s'exécute pendant l'installation, avec les droits du runner, sans qu'aucun humain
      # ne l'ait revu. Corriger le seul `npm ci` que l'outil pointe satisferait la porte sans
      # améliorer la posture — on joue avec le gate, pas contre lui.
      #
      # CE QUI EST MESURÉ DANS CE DÉPÔT, et qui rend ce refus sans coût :
      #  · le projet ne déclare AUCUN script de cycle de vie propre — ni `preinstall`, ni `install`,
      #    ni `postinstall`, ni `prepare`, ni `prepack` dans `package.json` ;
      #  · `package-lock.json` porte 8 entrées `hasInstallScript`, soit 7 paquets distincts :
      #    `esbuild`, `puppeteer`, `keytar`, plus 5 optionnels (`@parcel/watcher`, `fsevents` ×2,
      #    `lmdb`, `msgpackr-extract`) ;
      #  · les binaires natifs n'arrivent PAS par ces scripts mais par les optionalDependencies DE
      #    PLATEFORME, déjà verrouillées : `esbuild` en déclare 26, dont `@esbuild/linux-x64` bien
      #    présent dans le lockfile — son `postinstall` ne fait que vérifier ce qui est déjà là ;
      #  · `puppeteer` est le cas où sauter le script est ce qu'on voulait DÉJÀ : `.puppeteerrc.cjs`
      #    lui interdit de télécharger son propre Chromium (~200 Mo) ;
      #  · seul `keytar` cesse d'être utilisable sans sa compilation. C'est une dépendance de DEV, de
      #    `@azure/static-web-apps-cli`, atteinte depuis un unique point d'appel — un
      #    `await import("keytar")` paresseux et enveloppé d'un essai, dans
      #    `core/swa-cli-persistence-plugin/impl/credentials-store.js`, c'est-à-dire le chemin de
      #    CONNEXION. Ni `swa start` ni aucun gate ne l'empruntent.
      #
      # Mesuré sur un clone jetable de `main` le 2026-08-19 : `npm ci --ignore-scripts` (1077
      # paquets) puis `npm run build` réussissent, avec 10 hachages de style et 1 de script —
      # l'attendu exact ; les 2 SVG Mermaid sont rendus ; `npx swa start` sert 200 sous la CSP
      # complète, donc le harnais de G-e2e tient.
      # ⚠️ NE PAS AJOUTER DE `npm rebuild` pour « compenser » : aucun n'est nécessaire, et il
      # rouvrirait exactement l'exécution que cette option vient de fermer.
      # 🔒 Tenu par un tripwire — `src/workflows-github.spec.ts` exige `--ignore-scripts` sur TOUT
      # `npm ci` des workflows, et nomme le workflow et l'étape fautifs quand il manque.
      - name: Installer (verrouillé)
        run: npm ci --ignore-scripts

      # LE BINAIRE CDN, ET IL NE SORT PAS DE CE JOB. `rendre-mermaid.mjs` impose CE Chromium-là à
      # `mmdc` (`.puppeteerrc.cjs` interdit à Puppeteer de télécharger le sien). Il est téléchargé
      # hors du contrôle d'intégrité de `package-lock.json` : c'est pour l'éloigner de la machine
      # qui bâtit `dist/` que ce job existe.
      # ⚠️ `e2e:install:navigateur`, jamais `e2e:install` ni `e2e:install:deps` — le script combiné
      # enchaîne un `apt-get` en root, retiré de la CI le 2026-08-19 et interdit par un test.
      - name: Installer le navigateur (Chromium — pour `mmdc` uniquement)
        timeout-minutes: 5
        run: npm run e2e:install:navigateur

      # ⚠️ CE PRÉCHAUFFAGE N'EST PAS UNE OPTIMISATION — C'EST CE QUI REND LA COUPE POSSIBLE.
      # `gates` exécute G-test, et les specs du pipeline (`pipeline-contenu-orchestration`,
      # `garde-fou-lecons-non-publiees`) compilent les FIXTURES, qui portent des diagrammes. Sans
      # leurs entrées de cache, `mmdc` serait rappelé dans `gates` — donc un Chromium y serait
      # requis, donc la coupe n°2 ne servirait à rien. Mesuré le 2026-08-19, cache vidé au
      # préalable : ces deux racines produisent 4 entrées (5 blocs ` ```mermaid `, dont deux
      # sources IDENTIQUES qui partagent une clef de cache), et la suite complète n'en fait
      # apparaître AUCUNE de plus.
      #
      # 🔴 « LE COMPTE EST LE CONTRÔLE » — ET IL EST EXÉCUTABLE ICI, PAS SEULEMENT ÉCRIT.
      # La version précédente se contentait d'`echo`er un compte que personne ne comparait : un
      # `.cache/mermaid` déplacé ou un script de préchauffage devenu incomplet passait donc EN
      # SILENCE, et la panne surgissait trois étapes plus loin dans `gates`, sur un message qui
      # accuse Playwright — le mauvais coupable. Le minimum ci-dessous échoue ICI, où la faute est.
      # ⚠️ `attendu` est un MINIMUM, jamais une égalité : `content/` se remplira à E3-ST1 et le
      # compte ne peut que croître. Sa valeur est dérivée des fixtures et tenue par
      # `src/workflows-github.spec.ts` — la changer à la main sans changer les fixtures rougit.
      #
      # Il tourne AVANT la compilation de production : `rendre-mermaid.mjs --racine` n'écrit que le
      # cache, jamais `src/content-generated/` — mais garder cet ordre rend l'étape suivante seule
      # responsable de ce qui est empaqueté.
      - name: Préchauffer le cache Mermaid des fixtures (pour que `gates` reste vierge)
        run: |
          set -euo pipefail
          attendu=4
          npm run content:mermaid:prechauffer
          mkdir -p .cache/mermaid
          entrees="$(find .cache/mermaid -type f | wc -l)"
          if [ "$entrees" -lt "$attendu" ]; then
            echo "::error::le préchauffage a laissé $entrees entrée(s) dans .cache/mermaid pour $attendu attendue(s) au minimum. Le job « gates » rappellerait donc « mmdc » sans Chromium, et son message accuserait Playwright. Corriger le script « content:mermaid:prechauffer » (package.json) — surtout PAS en installant un navigateur dans « gates »."
            exit 1
          fi
          echo "cache Mermaid préchauffé : $entrees entrée(s) (minimum exigé : $attendu)."

      # Même étape que dans ci.yml, et AVANT G-lint (L-007 : un gate câblé dans un seul workflow
      # n'est pas câblé). `src/styles.scss` fait `@use` sur une feuille GITIGNORÉE que seul ce
      # pipeline produit : sans elle, G-test tombe le premier, sur une erreur Sass qui ne nomme pas
      # la cause. C'est aussi le gate du contenu — un `lecon.md` ou un `quiz.json` malformé fait
      # échouer la construction ici, en nommant le fichier et le champ fautifs, plutôt que de
      # publier une page vide.
      - name: Compiler `content/` (pipeline)
        run: npm run content:build

      # UN TAR, ET PAS TROIS `path:` DANS `upload-artifact` — deux pièges, tous deux SILENCIEUX.
      #   · `upload-artifact` exclut les fichiers cachés par défaut : `.cache/mermaid/` serait omis
      #     sans un mot, et `gates` rappellerait `mmdc` sans Chromium ;
      #   · la racine de l'artéfact est le plus proche ancêtre COMMUN des fichiers trouvés. Tant que
      #     `content/` est vide, aucun diagramme de production n'existe, `.cache/mermaid/` est vide,
      #     et cette racine glisserait de la racine du dépôt à `src/` — les fichiers seraient alors
      #     restaurés au MAUVAIS endroit, sans erreur.
      # Le tar fige les chemins et échoue en nommant ce qui manque. ⚠️ Le `mkdir -p` le fait
      # réussir même sur un cache VIDE — il ne prouve donc rien à lui seul, et c'est pour ça que
      # le minimum d'entrées est exigé à l'étape PRÉCÉDENTE, avant l'empaquetage.
      - name: Empaqueter les sorties compilées
        run: |
          set -euo pipefail
          mkdir -p .cache/mermaid
          tar -czf "$RUNNER_TEMP/contenu-compile.tgz" \
            src/content-generated \
            src/styles/_coloration-syntaxique-generee.scss \
            .cache/mermaid
          echo "$(tar -tzf "$RUNNER_TEMP/contenu-compile.tgz" | wc -l) entrée(s) empaquetée(s)."

      - name: Transmettre les sorties compilées
        uses: actions/upload-artifact@v7
        with:
          name: contenu-compile
          path: ${{ runner.temp }}/contenu-compile.tgz
          retention-days: 1
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # JOB 2 — toute la vérification, et AUCUN secret.
  # C'est ici que `dist/` est bâti — sur une machine où AUCUN binaire téléchargé d'un CDN n'a
  # tourné avant la construction : le navigateur ne s'installe qu'APRÈS le sceau, pour G-e2e.
  # Rien de ce qui s'exécute dans ce job n'a accès au jeton de publication, parce que ce job
  # ne le reçoit pas.
  # ---------------------------------------------------------------------------
  gates:
    name: gates (sans secret)
    needs: contenu
    runs-on: ubuntu-latest
    # Même filet que dans `ci.yml`, et pour la même panne du 2026-08-19 : ce job porte l'étape
    # d'installation du navigateur qui a pendu, à l'identique. Raisonnement complet là-bas.
    timeout-minutes: 25
    steps:
      # Majeures épinglées sur des actions qui tournent en Node 24 (checkout ≥ v5, setup-node ≥ v5).
      # En v4 elles ciblaient Node 20, déprécié : les runners les forçaient déjà en 24 avec un
      # avertissement, et ce forçage finira par disparaître.
      # `persist-credentials: false` : ce job n'a rien à dire à git, et c'est le SEUL où s'exécute
      # du code téléchargé (dépendances npm, navigateur Playwright). Le jeton d'Actions n'a donc
      # aucune raison de rester écrit dans la configuration git du runner, à portée de ce code.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      # `--ignore-scripts` : voir le raisonnement mesuré au même endroit du job `contenu`.
      - name: Installer (verrouillé)
        run: npm ci --ignore-scripts

      # LE PASSAGE DE TÉMOIN DU JOB `contenu`, ET LE TRIPWIRE DE LA COUPE N°2.
      # Ce job ne compile plus `content/` lui-même : il récupère ce que `contenu` a produit sur la
      # machine où tournait le navigateur. Ce qui arrive ici : `src/content-generated/` (leçons
      # compilées, manifeste de routes, carte d'imports), la feuille SCSS gitignorée que
      # `src/styles.scss` importe, et le CACHE MERMAID par hachage.
      #
      # ⚠️ CE CACHE EST CE QUI TIENT LA PROMESSE, et il faut savoir pourquoi. Les crochets `pretest`
      # et le script `build` rappellent `content:build` DANS ce job — c'est voulu, on ne le
      # court-circuite pas. Ce que ce job compile réellement, ce sont les FIXTURES, par les specs du
      # pipeline : avec un `content/` vide, la racine de production ne porte aucun diagramme.
      # Chaque socle demandé est alors trouvé sur le disque, repassé par l'analyseur à liste
      # blanche, et `invoquerMmdc` n'est jamais atteint.
      #
      # 🔴 ET C'EST BIEN `mmdc` QUI N'EST PAS INVOQUÉ, PAS SEULEMENT « le rendu qui n'a pas lieu ».
      # La nuance est neuve, et ce texte était FAUX SUR L'EFFET avant le 2026-08-19 : à l'époque,
      # `creerRendeurMermaid()` localisait `mmdc` ET Chromium dès sa CONSTRUCTION — un cache
      # parfaitement complet faisait donc échouer ce job quand même, sur « Chromium introuvable »,
      # alors qu'il n'y avait rien à rendre. La localisation est maintenant PARESSEUSE, déplacée
      # dans `invoquerMmdc` (`rendre-mermaid.mjs`, `localiserOutils`), et c'est ce déplacement qui
      # rend la phrase ci-dessus vraie. Mesuré, cache 2/2 vs 1/2 et `PLAYWRIGHT_BROWSERS_PATH` vide :
      # code 0 puis code 1.
      #
      # Si une entrée manquait, le rendu serait tenté et l'échec serait bruyant et nommé. C'est un
      # tripwire STRUCTUREL, pas une promesse écrite : il prouve à chaque run que la machine qui
      # bâtit `dist/` est vierge de binaire CDN. ⚠️ Ne pas « corriger » un tel échec en réinstallant
      # le navigateur ici — ce serait rouvrir la fenêtre que la coupe n°2 ferme ; il se corrige dans
      # `contenu`. ⚠️ Et attention au conseil que porte le message de `rendre-mermaid.mjs` : il
      # nomme le script COMBINÉ (`e2e:install`), qui enchaîne un `apt-get` en root INTERDIT dans
      # les workflows — un test du dépôt refuse son retour. En CI, la commande à rétablir est
      # `npm run e2e:install:navigateur`, et elle va dans `contenu`.
      - name: Récupérer les sorties compilées de `contenu`
        uses: actions/download-artifact@v7
        with:
          name: contenu-compile
          path: ${{ runner.temp }}

      # 🔴 UNE ARCHIVE TRANSFÉRÉE ENTRE JOBS EST UNE ENTRÉE — on l'ANALYSE, puis on la confronte à
      # une LISTE BLANCHE NOMINATIVE (`.claude/rules/security.md` §4, patron S-001/S-003/S-009/S-014).
      # Ce que faisait la version précédente, et pourquoi c'était l'ironie de ce lot : `tar -xzf`
      # SANS liste de membres, à la racine du dépôt, suivi d'un contrôle qui ne regardait que
      # l'EXISTENCE de deux chemins. Une archive portant les trois chemins attendus PLUS
      # `tools/deploiement/generer-config-swa.mjs` passait donc VERTE en affichant « Sorties du
      # pipeline restaurées » — et le générateur de la CSP venait d'être remplacé. Rejoué en labo
      # avant correctif : étape verte, code 0, fichier écrasé. Le rayon n'était pas `..` (GNU tar
      # 1.35 le neutralise) mais le WORKSPACE ENTIER : outils, `angular.json`, `node_modules/.bin`,
      # specs. Autrement dit, le job qui exécute le binaire CDN — celui dont ce lot existe pour
      # RETIRER la confiance — pouvait réécrire le garde-fou de CSP durci au lot A.
      #
      # TROIS BARRIÈRES, et chacune tient même si la précédente était contournée :
      #   0. 🔴 LES SEGMENTS DE CHEMIN SONT ANALYSÉS AVANT TOUT LE RESTE. Motif de la barrière : la
      #      liste blanche du point 1 est un MOTIF appliqué à un chemin SÉRIALISÉ, et un motif ne
      #      sait pas ce qu'est un segment. Mesuré : `src/content-generated/../../tools/deploiement/
      #      generer-config-swa.mjs` passe la liste blanche (`(/.*)?` l'apparie) ET le contrôle de
      #      type — sortie observée « LISTE BLANCHE : AUCUN INTRUS », « TYPES OK ». Seul GNU tar
      #      1.35 l'arrêtait ensuite, en refusant le membre lui-même : fail-closed, donc sans
      #      danger réel, mais la première barrière était HORS-JEU sur toute cette classe. On
      #      découpe donc le chemin sur `/` et on refuse tout segment valant `..` ou `.` —
      #      apparier un motif sur un chemin sérialisé n'est pas analyser une structure de chemin
      #      (famille S-003/S-014, la même que celle que ce lot paie partout ailleurs).
      #   1. la liste des membres est confrontée à la liste blanche AVANT toute écriture. Tout
      #      membre hors liste fait échouer l'étape EN SE NOMMANT — jamais un retrait silencieux,
      #      qui masquerait la régression qui l'a fait apparaître. Le contrôle porte aussi sur le
      #      TYPE : seuls fichier ordinaire (`-`) et répertoire (`d`) sont admis, parce qu'un lien
      #      symbolique dont le NOM est dans la liste blanche (`src/content-generated/passerelle`
      #      → `../../tools/deploiement/generer-config-swa.mjs`) passerait le contrôle de chemin.
      #      Mesuré : archive forgée à la main, refusée sur son type.
      #   2. l'extraction NOMME les membres — ce qui n'est pas dans ces trois-là n'est pas écrit,
      #      même si l'analyse avait laissé passer quelque chose. `--no-same-owner` retire à
      #      l'archive le droit de choisir le propriétaire des fichiers restaurés.
      #
      # Les contrôles d'existence qui suivent restent, et pour leur raison d'origine : le tar
      # échouerait déjà si l'archive était incomplète, mais un `@use` sur une feuille absente donne
      # une erreur Sass qui ne nomme PAS sa cause (piège documenté dans CLAUDE.md). On nomme donc
      # les sorties ici, où l'échec est lisible, plutôt que trois gates plus loin.
      # ⚠️ LE CACHE MERMAID EN FAIT PARTIE, et il ne l'a pas toujours fait : le contrôle ne
      # regardait que les DEUX autres sorties, alors que le cache est précisément celle dont
      # l'absence rouvre la coupe n°2. Un dossier vide passerait un simple test d'existence — on
      # exige donc ici le MÊME minimum qu'à l'émission, symétriquement. Les deux nombres sont
      # tenus ensemble par `src/workflows-github.spec.ts`, qui les dérive des fixtures.
      - name: Déballer les sorties compilées
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/contenu-compile.tgz"
          membres="$RUNNER_TEMP/membres-contenu-compile.txt"
          detail="$RUNNER_TEMP/membres-contenu-compile-detail.txt"
          tar -tzf "$archive" > "$membres"
          tar -tvzf "$archive" > "$detail"

          traversee="$(awk -F/ '{ for (i = 1; i <= NF; i++) if ($i == ".." || $i == ".") { print; next } }' "$membres" || true)"
          if [ -n "$traversee" ]; then
            echo "::error::l'archive « contenu-compile » porte des membres dont un segment de chemin vaut « .. » ou « . » — déballage refusé, rien n'a été écrit."
            printf '%s\n' "$traversee" | while IFS= read -r membre; do
              echo "::error::membre refusé (segment de traversée) : $membre"
            done
            exit 1
          fi

          intrus="$(grep -Ev '^(src/content-generated(/.*)?|\.cache/mermaid(/.*)?|src/styles/_coloration-syntaxique-generee\.scss)$' "$membres" || true)"
          if [ -n "$intrus" ]; then
            echo "::error::l'archive « contenu-compile » porte des membres HORS de la liste blanche — déballage refusé, rien n'a été écrit."
            printf '%s\n' "$intrus" | while IFS= read -r membre; do
              echo "::error::membre refusé : $membre"
            done
            exit 1
          fi

          types="$(cut -c1 "$detail" | grep -Ev '^[-d]$' | sort -u | tr '\n' ' ' | sed 's/[[:space:]]*$//' || true)"
          if [ -n "$types" ]; then
            echo "::error::l'archive porte des membres qui ne sont ni fichier ordinaire ni répertoire (type(s) : $types) — déballage refusé, rien n'a été écrit."
            exit 1
          fi

          tar -xzf "$archive" --no-same-owner -- \
            src/content-generated \
            src/styles/_coloration-syntaxique-generee.scss \
            .cache/mermaid

          for chemin in src/content-generated src/styles/_coloration-syntaxique-generee.scss .cache/mermaid; do
            if [ ! -e "$chemin" ]; then
              echo "::error::« $chemin » manque après déballage — le job « contenu » ne l'a pas produit."
              exit 1
            fi
          done

          attendu=4
          entrees="$(find .cache/mermaid -type f | wc -l)"
          if [ "$entrees" -lt "$attendu" ]; then
            echo "::error::le cache Mermaid restauré ne porte que $entrees entrée(s) pour $attendu attendue(s) au minimum : « content:build » va rappeler « mmdc » dans ce job, qui n'a AUCUN Chromium. Le défaut est dans le job « contenu » (préchauffage ou empaquetage) — ne pas installer de navigateur ici, ce serait rouvrir la fenêtre que la coupe n°2 ferme."
            exit 1
          fi
          echo "Sorties du pipeline restaurées ($(wc -l < "$membres") membre(s), tous dans la liste blanche) ; cache Mermaid : $entrees entrée(s) (minimum exigé : $attendu)."

      - name: G-lint
        run: npm run lint

      # Même gate que dans ci.yml, au même rang. Il compte doublement ici : le script qu'il
      # type-vérifie est celui qui GÉNÈRE la CSP téléversée à l'étape de déploiement ci-dessous.
      # Voir la note de `ci.yml` pour le pourquoi.
      - name: G-typage-outils
        run: npm run typecheck:tools

      # Même gate que dans ci.yml, au même rang : les deux workflows doivent rester alignés,
      # sinon ce qui part en ligne est moins vérifié que ce qui passe en PR. Voir la note de
      # `ci.yml` pour le détail de ce que G-contraste mesure.
      - name: G-contraste
        run: npm run design:contrastes:check

      # Gate des polices auto-hébergées : ouvre chaque .woff2 livré, décompresse son flux et lit sa
      # table cmap. Vérifie les DEUX moitiés — le caractère est dans un unicode-range déclaré ET le
      # fichier porte vraiment son glyphe. Un sous-ensemble trop agressif casse « œ », « » et ’ en
      # silence, au milieu d’un mot : sans ce gate, rien ne le signalerait avant la mise en ligne.
      - name: G-glyphes
        run: npm run design:glyphes

      - name: G-test
        run: npm test

      # ⚠️ ICI, ET SEULEMENT ICI, C'EST BIEN `npm run build` — sur la racine de PRODUCTION.
      # `ci.yml` bâtit le même artéfact depuis la fixture témoin (décision E-2, E2-ST3 lot E), pour
      # que G-axe et G-e2e voient en permanence une page de leçon INTERACTIVE malgré un `content/`
      # vide jusqu'à E3-ST1. Ce workflow-ci PUBLIE : il doit construire ce qui part en ligne, ni
      # plus ni moins. Deux conséquences à ne pas confondre avec des anomalies :
      #   · le compte de hachages de style diffère entre les deux workflows (9 ici — le défaut
      #     épinglé de `NOMBRE_HACHAGES_STYLE_ATTENDU` —, 12 en CI). Aucun drapeau
      #     `--hachages-style` ne se pose ici : l'absence de drapeau EST la valeur de production ;
      #   · la CSP mesurée en CI n'est donc pas octet pour octet celle du déploiement. La parade
      #     ne bouge pas : ce sont les vérifications EN LIGNE, fail-closed, plus bas dans ce même
      #     fichier, qui font foi sur les directives réellement servies.
      - name: G-build (+ config SWA à hachages)
        run: npm run build

      # LE SCEAU — posé ici, rompu nulle part, revérifié juste avant le téléversement.
      # Séparer `publication` (voir l'en-tête, coupe n°1) empêche le code téléchargé d'atteindre le
      # JETON ; ça ne l'empêche pas d'atteindre l'ARTÉFACT, puisque tout ce qui suit tourne entre la
      # construction de `dist/` et son envoi. Ce que ce sceau couvre est donc, DEPUIS LE LOT C de la
      # dette pré-E3-ST1, l'INTÉGRALITÉ de ce qui s'exécute après la construction : l'installation du
      # navigateur (binaire hors du contrôle d'intégrité de `package-lock.json`), G-axe, G-e2e et
      # G-audit. C'est ce que la coupe n°2 a rendu possible — le navigateur ne sert plus à compiler
      # le contenu, il est donc redescendu ICI, dans la fenêtre surveillée, au lieu de la précéder.
      # Aucun de ces gates n'a de raison d'écrire `dist/` ; l'empreinte le prouve au lieu de l'espérer.
      # Le manifeste est écrit dans `RUNNER_TEMP`, donc HORS de `dist/` : à l'intérieur, il ferait
      # partie de ce qu'il mesure et se réécrirait lui-même.
      #
      # ⚠️ CE QUE CE SCEAU NE COUVRE TOUJOURS PAS, et il faut le lire avant de le croire complet :
      # ce qui a été construit AVANT lui. `npm ci` et le job `contenu` alimentent `dist/` ; un
      # paquet ou un SVG compromis y serait scellé de bonne foi. Un sceau atteste qu'un dossier n'a
      # pas bougé, jamais qu'il est sain (patron S-009).
      # ⚠️ NOM ENTRE QUOTES, ET IL DOIT LE RESTER. Il contient « portée : construction », donc un
      # « : » suivi d'une espace — en YAML, dans un scalaire NON quoté, cette séquence ouvre une
      # clef de mapping et rend le fichier illisible. GitHub ne signale alors pas une erreur de
      # syntaxe utile : il crée un run en ÉCHEC INSTANTANÉ (0 s) « workflow file issue », sur
      # n'importe quel push, y compris ceux qu'aucun déclencheur du fichier ne visait. Payé ici le
      # 2026-08-16.
      - name: "Sceller l'artéfact (portée : construction → téléversement, tout ce qui suit compris)"
        run: |
          set -euo pipefail
          find dist/dr-je-sais-tout/browser -type f -exec sha256sum {} + \
            | sort -k 2 > "$RUNNER_TEMP/sceau-dist.txt"
          echo "$(wc -l < "$RUNNER_TEMP/sceau-dist.txt") fichier(s) scellé(s)."

      # LE NAVIGATEUR, REDESCENDU ICI PAR LE LOT C — et c'est le point de tout le lot.
      # Il n'est plus nécessaire à la compilation du contenu (le job `contenu` s'en charge, et son
      # cache Mermaid voyage jusqu'ici) : il ne sert plus qu'à G-e2e. Le poser APRÈS le sceau le
      # remet dans la fenêtre surveillée — si ce binaire réécrivait `dist/`, « Vérifier le sceau
      # avant publication » refuserait de publier.
      # ⚠️ NE PAS LE REMONTER. Au-dessus du sceau, il redevient invisible à celui-ci, et la portée
      # réduite que ce lot vient de corriger se réinstalle en silence.
      - name: Installer le navigateur (Chromium — pour G-e2e uniquement)
        timeout-minutes: 5
        run: npm run e2e:install:navigateur

      # Même gate que dans ci.yml, au même rang — juste après G-build, dont il consomme l'artéfact.
      # Il compte doublement ici : ce sont EXACTEMENT les pages téléversées à l'étape de déploiement
      # ci-dessous qu'il audite. Première commande : l'auto-test du gate (preuve qu'il mord) ;
      # seconde : l'audit des pages. Voir la note de `ci.yml` pour ce qu'il couvre. Ce qu'il ne
      # couvre PAS — clavier, focus, taille de cible — est désormais tenu par G-e2e juste en
      # dessous : ce n'est plus une dette ni une checklist manuelle.
      - name: G-axe
        run: |
          npm run a11y:axe:auto-test
          npm run a11y:axe

      # Même gate que dans ci.yml, au même rang — juste après G-axe, dont il partage l'artéfact.
      # Il compte doublement ici : `swa start` émule le runtime d'Azure Static Web Apps, donc ce
      # sont bien les pages téléversées à l'étape de déploiement ci-dessous qui sont exercées SOUS
      # LA CSP QU'ELLES EMPORTENT. C'est la seule vérification du dépôt qui presse de vraies touches
      # sur la page interactive avant qu'elle parte en ligne — l'angle mort de la leçon S-005. Voir
      # la note de `ci.yml` pour ce qu'il couvre (clavier, focus, taille de cible) et l'en-tête de
      # `playwright.config.ts` pour le choix du serveur. Le navigateur, lui, est installé juste
      # après le sceau — c'est le SEUL gate de ce job qui en a besoin (lot C, coupe n°2).
      - name: G-e2e (accessibilité au clavier, sous CSP réelle)
        run: npm run e2e

      - name: G-audit
        run: npm audit --omit=dev

      # Le sceau est rompu ? Alors quelque chose a réécrit l'artéfact APRÈS que les gates l'ont
      # jugé — et ce quelque chose est, par construction, du code qui s'est exécuté ensuite. On ne
      # publie pas : le dossier téléversé ne serait plus celui qui a été vérifié.
      - name: Vérifier le sceau avant publication
        run: |
          set -euo pipefail
          find dist/dr-je-sais-tout/browser -type f -exec sha256sum {} + \
            | sort -k 2 > "$RUNNER_TEMP/sceau-dist-apres.txt"
          if ! diff -u "$RUNNER_TEMP/sceau-dist.txt" "$RUNNER_TEMP/sceau-dist-apres.txt"; then
            echo "::error::dist/ a changé entre G-build et le téléversement — publication refusée."
            exit 1
          fi
          echo "Sceau intact : l'artéfact publié est bit pour bit celui que les gates ont vérifié."

      # Le passage de témoin entre les deux jobs. Ce qui est téléversé plus bas est EXACTEMENT ce
      # que les gates ci-dessus viennent de vérifier — `staticwebapp.config.json` compris, puisqu'il
      # est généré DANS ce dossier par `npm run build` et que c'est lui qui porte la CSP.
      #
      # ⚠️ Pas de `include-hidden-files` : l'artéfact n'en contient aucun (404/, cours/, polices/,
      # index.html, les deux fichiers empreintés, staticwebapp.config.json). Cette entrée existe et
      # devra être ajoutée le jour où un fichier commençant par un point sera livré — sinon il
      # serait omis EN SILENCE, et le site partirait amputé sans qu'aucune étape ne rougisse.
      - name: Transmettre l'artéfact vérifié
        uses: actions/upload-artifact@v7
        with:
          name: site-verifie
          path: dist/dr-je-sais-tout/browser
          retention-days: 7
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # JOB 2 — la publication, et RIEN d'autre.
  # Seul job à recevoir `AZURE_STATIC_WEB_APPS_API_TOKEN`. Il n'installe aucune dépendance,
  # ne compile rien, n'exécute aucun binaire téléchargé : il téléverse l'artéfact déjà vérifié,
  # puis constate en ligne. `needs: gates` fait qu'un seul gate rouge suffit à empêcher toute
  # publication — la promesse « rien ne part en ligne sans être passé au vert » est tenue par
  # cette dépendance, pas par l'ordre des étapes.
  # ---------------------------------------------------------------------------
  publication:
    name: déploiement · vérification en ligne
    needs: gates
    runs-on: ubuntu-latest
    # Filet plus large que celui de `gates`, et c'est délibéré : ce job ATTEND un effet distant.
    # SWA répond 200 pendant ~30-60 s AVANT d'appliquer `staticwebapp.config.json` (L-004), donc
    # les vérifications en ligne réessaient par construction. 30 min laisse la marge à ces
    # attentes tout en gardant un plafond très en deçà des six heures de GitHub — c'est le job qui
    # détient le jeton SWA, celui où un blocage silencieux se remarque le plus tard.
    timeout-minutes: 30
    steps:
      # Le dépôt est nécessaire à l'action de déploiement, qui lit le contexte du dépôt en plus
      # du dossier à téléverser. `persist-credentials: false` : rien ici ne parle à git, le jeton
      # d'Actions n'a donc aucune raison de rester écrit dans la configuration git du runner.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # L'artéfact reprend sa place exacte : `app_location` ci-dessous pointe ce chemin, et le
      # garder identique à celui du job de gates évite qu'une divergence de chemin fasse téléverser
      # un dossier vide.
      - name: Récupérer l'artéfact vérifié
        uses: actions/download-artifact@v8
        with:
          name: site-verifie
          path: dist/dr-je-sais-tout/browser

      # `skip_app_build: true` : l'artéfact est déjà construit par l'étape G-build du job `gates`,
      # avec la config SWA générée dedans. Laisser l'action rebuilder produirait un dossier SANS
      # staticwebapp.config.json résolu — donc sans CSP. C'est d'autant plus vrai ici : ce job n'a
      # même pas de `node_modules`, l'action n'aurait rien avec quoi construire.
      # Pas de `skip_api_build` : cette entrée N'EXISTE PAS dans l'action (elle l'annonçait en
      # avertissement). `api_location: ''` suffit — sans API, il n'y a rien à construire.
      #
      # 🔴 ÉPINGLÉE AU SHA, et c'est la seule action du dépôt qui le MÉRITE vraiment : elle
      # s'exécute dans le job qui détient `AZURE_STATIC_WEB_APPS_API_TOKEN`. Un tag `v1` est
      # MUTABLE — celui qui contrôle le dépôt amont peut le repointer sur n'importe quel commit,
      # qui s'exécuterait ici avec le jeton de déploiement en variable d'environnement, sans
      # qu'aucune revue de PR ne voie le changement. Un SHA de commit, lui, ne se réécrit pas.
      #
      # ⚠️ CE SHA EST CELUI DU TAG, PAS CELUI DE LA BRANCHE. Le dépôt amont porte un tag `v1` ET
      # une branche `v1` qui ont DIVERGÉ. GitHub résout `@v1` vers le TAG : c'est donc bien
      # 1a947af… que la production exécutait déjà, relevé dans le journal du run 32308397145 (le
      # dernier déploiement vert, 2026-08-19). Prendre le commit de branche, plus récent, aurait
      # été une montée de version déguisée en durcissement — un épinglage FIGE, il n'upgrade pas.
      #
      # Pour relever la version plus tard : lire le SHA du tag visé dans le dépôt amont, le
      # remplacer ici, et garder le commentaire `# v…` à jour — c'est lui qui rend le SHA lisible.
      - name: Déployer sur Azure Static Web Apps
        id: deploiement
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1 — relevé du journal du run 32308397145, 2026-08-19
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: dist/dr-je-sais-tout/browser
          api_location: ''
          output_location: ''
          skip_app_build: true

      # Constat en ligne de ce qui n'a pu être vérifié en local (voir docs/deployment.md) :
      # les en-têtes sont-ils réellement servis, et la CSP porte-t-elle un hachage résolu ?
      # Ne remplace pas le constat navigateur (violations CSP à l'exécution) : celui-là se fait
      # à l'œil sur l'URL, console ouverte.
      - name: Vérifier les en-têtes servis
        env:
          URL: ${{ steps.deploiement.outputs.static_web_app_url }}
        run: |
          set -euo pipefail
          if [ -z "${URL:-}" ]; then
            echo "::error::URL non fournie par l'action — impossible de vérifier les en-têtes du site DÉJÀ PUBLIÉ. Confirmer le nom de la sortie de l'action."
            exit 1
          fi
          echo "Cible : $URL"

          # SWA renvoie 200 AVANT d'avoir appliqué staticwebapp.config.json : la page est servie,
          # mais sans en-têtes, pendant ~30-60 s après le téléversement. `curl --retry` ne rattrape
          # PAS ce cas — la réponse est un succès, donc curl ne réessaie jamais (constaté au premier
          # déploiement, 2026-08-04 : 200 avec seulement content-type et date). D'où l'attente
          # active sur la présence effective de la CSP.
          entetes=""
          for essai in $(seq 1 12); do
            entetes=$(curl -sS -D - -o /dev/null "$URL" || true)
            if grep -qi "^content-security-policy:" <<<"$entetes"; then
              echo "En-têtes appliqués (tentative ${essai})."
              break
            fi
            echo "Config pas encore propagée (${essai}/12) — attente 10 s…"
            sleep 10
          done

          echo "$entetes"

          # LA CAPTURE SERT DEUX FOIS : aux contrôles par motifs ci-dessous, puis à la
          # comparaison structurelle en fin d'étape. Elle est écrite sur DISQUE plutôt que
          # recapturée — une seconde requête pourrait tomber sur un autre état de propagation,
          # et c'est ICI qu'on a attendu l'EFFET, pas le code de retour (L-004).
          capture="${RUNNER_TEMP:-/tmp}/entetes-servis.txt"
          printf '%s\n' "$entetes" > "$capture"

          manquants=0
          for attendu in "content-security-policy" "strict-transport-security" "x-content-type-options" "referrer-policy" "permissions-policy"; do
            if ! grep -qi "^$attendu:" <<<"$entetes"; then
              echo "::error::En-tête absent : $attendu"
              manquants=1
            fi
          done

          if grep -qi "__HACHAGES_STYLE__" <<<"$entetes"; then
            echo "::error::CSP non résolue — le jeton __HACHAGES_STYLE__ est servi tel quel. Le site s'affichera SANS STYLES."
            manquants=1
          fi
          if ! grep -i "^content-security-policy:" <<<"$entetes" | grep -q "sha256-"; then
            echo "::error::CSP sans hachage sha256- : le bloc <style> d'Angular sera bloqué."
            manquants=1
          fi

          # Les DIRECTIVES, pas seulement la présence de l'en-tête. Une CSP servie mais permissive
          # passait jusqu'ici toutes les vérifications ci-dessus — c'est exactement la faille que ce
          # site ENSEIGNE. Ces quatre-là ne sont observables QUE sur le site publié : le harnais
          # Playwright tourne en HTTP sur localhost, où `frame-ancestors` et `upgrade-insecure-
          # requests` n'ont aucun effet mesurable (voir l'en-tête de `playwright.config.ts`).
          csp=$(grep -i "^content-security-policy:" <<<"$entetes" || true)
          for directive in "object-src 'none'" "base-uri 'self'" "frame-ancestors 'none'" "upgrade-insecure-requests"; do
            if ! grep -qF "$directive" <<<"$csp"; then
              echo "::error::Directive CSP absente ou affaiblie : $directive"
              manquants=1
            fi
          done
          # Le complément : ce qui ne doit JAMAIS apparaître. Un `unsafe-inline` ou un `strict-dynamic`
          # glissé dans la CSP rendrait les hachages décoratifs sans rien casser de visible.
          for interdit in "unsafe-inline" "unsafe-eval" "strict-dynamic"; do
            if grep -qF "$interdit" <<<"$csp"; then
              echo "::error::CSP affaiblie — « $interdit » est servi : les hachages ne protègent plus rien."
              manquants=1
            fi
          done

          # HSTS : la présence ne suffit pas, c'est la durée qui fait la protection.
          if ! grep -i "^strict-transport-security:" <<<"$entetes" | grep -qE "max-age=[0-9]+"; then
            echo "::error::Strict-Transport-Security sans max-age exploitable."
            manquants=1
          fi

          # =====================================================================
          # LA COMPARAISON STRUCTURELLE — ce que tout ce qui précède ne pouvait pas voir.
          # ---------------------------------------------------------------------
          # Tous les contrôles ci-dessus cherchent des MOTIFS : un nom d'en-tête, un
          # `sha256-`, quatre directives écrites en clair, trois mots interdits. Une CSP
          # servie pouvait donc porter une directive ENTIÈRE de plus, ou une directive
          # affaiblie que ces motifs ne nomment pas (`img-src *`, `connect-src https:`),
          # et sortir verte. C'est la faille que ce site ENSEIGNE : une liste NOIRE ne
          # refuse que ce que son auteur a imaginé (`.claude/rules/security.md` §4).
          #
          # Le script confronte la politique SERVIE à celle de l'artéfact téléversé, puis
          # celle de l'artéfact à `config/staticwebapp.config.source.json` — le seul des
          # trois documents qu'un humain relit en revue. Égalité EXACTE, directive par
          # directive, modulo les jetons `__HACHAGES_*__` qui n'ont le droit de devenir
          # que des `'sha256-…'` (S-005 : la liste blanche reste NOMINATIVE).
          #
          # ⚠️ LES CONTRÔLES PAR MOTIFS CI-DESSUS NE SONT PAS DES DOUBLONS — NE PAS LES
          # RETIRER. L'égalité structurelle subsume leurs contrôles DE CSP, et rien d'autre :
          # le comparateur ne lit QUE l'en-tête `Content-Security-Policy`. La présence des
          # quatre en-têtes hors CSP (`strict-transport-security`, `x-content-type-options`,
          # `referrer-policy`, `permissions-policy`) et le `max-age=` de HSTS n'ont AUCUNE
          # autre couverture que les lignes ci-dessus — un `Permissions-Policy: camera=*`
          # servi passerait le comparateur sans une erreur. S'y ajoute la valeur de
          # diagnostic : leurs messages nomment la faute en clair là où un delta structurel
          # demande une lecture.
          #
          # Node seul, ZÉRO dépendance npm : ce job détient le jeton de déploiement et n'a
          # pas de `node_modules`. Un `npm ci` ici élargirait la surface d'exécution du job
          # le plus sensible du dépôt à tout l'arbre de dépendances.
          # =====================================================================
          if ! command -v node >/dev/null 2>&1; then
            echo "::error::\`node\` introuvable sur le runner : la comparaison structurelle de la CSP ne peut pas s'exécuter. Ne pas conclure au vert — c'est le gate qui manque, pas la conformité qui est prouvée."
            exit 1
          fi
          if ! node tools/deploiement/verifier-csp-servie.mjs \
            --entetes "$capture" \
            --artefact dist/dr-je-sais-tout/browser/staticwebapp.config.json \
            --source config/staticwebapp.config.source.json; then
            manquants=1
          fi

          exit $manquants

      # Le routage de production change dans E1-ST2 : `navigationFallback` est retiré et
      # `responseOverrides.404` pointe désormais sur la page 404 réellement prerendue. Ces deux
      # choses ne s'observent qu'EN LIGNE — rien en local ne dit ce que SWA fait d'une URL inconnue.
      # Comme à l'étape précédente, on attend l'EFFET et jamais le seul code de retour (L-004) :
      # pendant les ~30-60 s où staticwebapp.config.json n'est pas encore appliqué, une URL inconnue
      # répond 200 avec la coquille du site. C'est un SUCCÈS pour curl, donc `--retry` ne rattrape
      # rien — d'où l'attente active sur le statut 404 réellement rendu.
      - name: Vérifier le routage servi (404 et coquille de rendu client)
        env:
          URL: ${{ steps.deploiement.outputs.static_web_app_url }}
        run: |
          set -euo pipefail
          if [ -z "${URL:-}" ]; then
            echo "::error::URL non fournie par l'action — impossible de vérifier le routage du site DÉJÀ PUBLIÉ."
            exit 1
          fi
          base="${URL%/}"
          entetes="${RUNNER_TEMP:-/tmp}/entetes-404.txt"
          echo "Cible : $base"

          # (a) Une URL inconnue doit rendre NOTRE page 404 : statut 404, corps « Page introuvable »,
          #     et en-têtes de sécurité présents (une page d'erreur reste une page servie).
          statut=""
          corps=""
          for essai in $(seq 1 12); do
            : > "$entetes"
            corps=$(curl -sS -D "$entetes" "$base/chemin-inexistant-verification-ci/" || true)
            statut=$(head -n 1 "$entetes" | tr -d '\r' | awk '{print $2}')
            if [ "$statut" = "404" ]; then
              echo "Routage 404 appliqué (tentative ${essai})."
              break
            fi
            echo "URL inconnue servie en ${statut:-aucun} — config pas encore propagée (${essai}/12), attente 10 s…"
            sleep 10
          done

          echecs=0
          if [ "$statut" != "404" ]; then
            echo "::error::URL inconnue servie en ${statut:-aucun} au lieu de 404 — soft-404 indexable."
            echecs=1
          fi
          if ! grep -qi "^content-security-policy:" "$entetes"; then
            echo "::error::La page 404 est servie SANS en-tête Content-Security-Policy."
            echecs=1
          fi
          if ! grep -q "Page introuvable" <<<"$corps"; then
            echo "::error::La page servie sur une URL inconnue n'est pas la nôtre — « Page introuvable » absent du corps."
            echecs=1
          fi

          # (b) /index.csr.html est un artéfact de `ng build` (coquille vide, ni repère ni titre),
          #     pas une page du site : l'URL doit être fermée par une redirection 301 vers /.
          #     curl ne suit pas les redirections par défaut : le code lu est bien celui de SWA.
          statut_csr=""
          for essai in $(seq 1 12); do
            statut_csr=$(curl -sS -o /dev/null -w '%{http_code}' "$base/index.csr.html" || true)
            if [ "$statut_csr" = "301" ]; then
              echo "Redirection de /index.csr.html appliquée (tentative ${essai})."
              break
            fi
            echo "/index.csr.html servi en ${statut_csr:-aucun} — config pas encore propagée (${essai}/12), attente 10 s…"
            sleep 10
          done
          if [ "$statut_csr" != "301" ]; then
            echo "::error::/index.csr.html servi en ${statut_csr:-aucun} au lieu de 301 — la coquille de rendu client est publiquement servie."
            echecs=1
          fi

          # (c) AUCUN asset référencé par la page d'accueil ne doit être servi par une REDIRECTION.
          #     Ce n'est pas une vérification de performance : c'est une vérification de CHARGEMENT.
          #     Un module ES redirigé garde l'URL d'ARRIVÉE comme base de ses imports relatifs. Quand
          #     `trailingSlash: "always"` déplaçait `/main-X.js` vers `/main-X.js/`, le bundle
          #     s'exécutait quand même (200, bon type MIME) mais son `import('./chunk-Y.js')` visait
          #     `/main-X.js/chunk-Y.js` — 404. Le site se chargeait, la route paresseuse non.
          #
          #     ⚠️ POURQUOI CE CONTRÔLE EST EN LIGNE ET NULLE PART AILLEURS. `trailingSlash` n'existe
          #     PAS dans l'émulateur `swa start` (aucune occurrence dans son code) : le gate e2e tourne
          #     donc sous une politique de routage qui n'est pas celle de la production, et il est
          #     resté VERT pendant que la production était cassée. Un émulateur qui ignore une
          #     directive ne la valide pas, il la masque (L-005, versant routage).
          #
          #     La liste des assets est LUE dans la page réellement servie, et c'est voulu : c'est
          #     exactement la liste que le navigateur suivra. Le contrôle POSITIF est le compte —
          #     une page dont on n'extrait aucun asset ferait passer ce test sans rien mesurer (L-019).
          accueil=$(curl -sS "$base/" || true)
          assets=$(printf '%s' "$accueil" \
            | grep -oE '(src|href)="[^"]+\.(js|css)"' \
            | sed -E 's/^(src|href)="//; s/"$//' \
            | sort -u)
          nb_assets=$(printf '%s' "$assets" | grep -c . || true)
          if [ "${nb_assets:-0}" -lt 2 ]; then
            echo "::error::Seulement ${nb_assets:-0} asset(s) extrait(s) de la page d'accueil — le contrôle ne mesure rien (attendu : au moins le bundle et la feuille de styles)."
            echecs=1
          else
            echo "Assets référencés par / : ${nb_assets}"
          fi

          while IFS= read -r asset; do
            [ -n "$asset" ] || continue
            # Résolution contre `<base href="/">` : les chemins émis par Angular sont relatifs.
            case "$asset" in
              http*) cible="$asset" ;;
              /*)    cible="$base$asset" ;;
              *)     cible="$base/$asset" ;;
            esac
            statut_asset=$(curl -sS -o /dev/null -w '%{http_code}' "$cible" || true)
            if [ "$statut_asset" != "200" ]; then
              echo "::error::Asset « $asset » servi en ${statut_asset:-aucun} au lieu de 200 — une redirection sur un module ES casse ses imports relatifs (relire trailingSlash dans config/staticwebapp.config.source.json)."
              echecs=1
            fi
          done <<<"$assets"

          exit $echecs
