# =============================================================================
# SonarCloud — reglages de l'ANALYSE AUTOMATIQUE (app GitHub, aucun job CI)
# -----------------------------------------------------------------------------
# Gratuit et sans cle : l'analyse est declenchee par l'application GitHub de
# SonarCloud, il n'y a donc ni jeton ni etape de workflow a maintenir.
#
# Trois pieges de ce fichier, verifies dans la doc avant de l'ecrire :
#   1. il n'est lu QUE depuis la branche par defaut (`main`) — un reglage pose
#      ici ne change rien a l'analyse de la PR qui l'introduit, il ne prend
#      effet qu'une fois fusionne ;
#   2. les motifs generiques (`*`, `**`) n'y sont PAS permis — chemin exact ;
#   3. il ne se confond pas avec `sonar-project.properties`, qui vise l'analyse
#      en CI : SonarCloud IGNORE ce dernier tant que l'analyse automatique est
#      active. Ne pas en ajouter un en croyant regler quelque chose.
#
# Seules ces cles sont supportees ici : sonar.sources, sonar.exclusions,
# sonar.inclusions, sonar.tests, sonar.test.exclusions, sonar.test.inclusions,
# sonar.sourceEncoding, sonar.cpd.exclusions, sonar.python.version,
# sonar.cfamily.reportingCppStandardOverride. En particulier,
# `sonar.issue.ignore.multicriteria` n'en fait PAS partie : un faux positif
# d'issue se clot dans l'interface SonarCloud, pas ici.
# =============================================================================

# --- Detection de copier-colle (CPD) -----------------------------------------
# `verifier-contrastes.mjs` porte la TABLE DECLARATIVE du gate de contraste :
# 33 n-uplets `[premier plan, fond, usage, seuil]` que Prettier eclate sur
# plusieurs lignes chacun (printWidth 100). Le detecteur y voit 2 blocs
# « dupliques » de 76 lignes qui se CHEVAUCHENT (166-233 et 172-241) : c'est la
# signature d'une donnee uniforme repetee, pas d'une logique copiee-collee.
# Compacter cette table pour satisfaire le detecteur rendrait illisible la
# specification meme que le gate d'accessibilite est cense rendre auditable.
#
# Contrepartie assumee : un vrai copier-colle de LOGIQUE dans ce fichier ne sera
# plus signale. Elle est acceptable ici parce que ce fichier est un outil de
# BUILD — il n'est jamais servi au navigateur — et parce que l'exclusion est
# nominative : elle ne couvre pas le reste de `tools/`.
sonar.cpd.exclusions=tools/design/verifier-contrastes.mjs
